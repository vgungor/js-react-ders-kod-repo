<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Dark Mode</title>

    <style>
      body {
        font-family: Arial;
        background-color: white;
        color: black;
        transition: 0.5s;
        padding: 30px;
      }

      .dark {
        background-color: #1e1e1e;
        color: white;
      }

      button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>

  <body id="sayfa">
    <h1>Dark Mode Uygulaması</h1>

    <p>Bu örnek classList.toggle kullanır.</p>

    <button onclick="temaDegistir()">Tema Değiştir</button>

    <script>
      function temaDegistir() {
        document.getElementById("sayfa").classList.toggle("dark");
      }
    </script>
  </body>
</html>
