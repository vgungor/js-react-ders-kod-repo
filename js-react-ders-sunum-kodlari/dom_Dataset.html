<ul>
  <li class="item" data-price="150" data-category="electronics">Kulaklık</li>
  <li class="item" data-price="20" data-category="stationery">Kalem</li>
  <li class="item" data-price="500" data-category="electronics">Klavye</li>
</ul>
<p id="info"></p>

<script>
  const items = document.querySelectorAll(".item");
  const infoDisplay = document.querySelector("#info");

  items.forEach((item) => {
    item.addEventListener("click", () => {
      // Dataset üzerinden verilere erişim
      const price = item.dataset.price;
      const cat = item.dataset.category;

      infoDisplay.textContent = `Bu ürünün fiyatı: ${price} TL, Kategorisi: ${cat}`;

      // Görsel geri bildirim
      item.style.fontWeight = "bold";
    });
  });
</script>
